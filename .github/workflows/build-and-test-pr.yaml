name: build-and-test-pr

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  require-label:
    uses: autowarefoundation/autoware-github-actions/.github/workflows/require-label.yaml@v1
    with:
      label: run:build-and-test-differential

  build-and-test:
    needs: require-label
    if: ${{ needs.require-label.outputs.result == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        rosdistro: [humble, jazzy]
    uses: ./.github/workflows/build-and-test-reusable.yaml
    with:
      rosdistro: ${{ matrix.rosdistro }}
      container: ghcr.io/autowarefoundation/autoware:universe-dependencies-cuda-${{ matrix.rosdistro }}
